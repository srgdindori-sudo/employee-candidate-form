<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Selection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      text-align: center;
      width: 85%;
      max-width: 400px;
    }

    h2 {
      margin-bottom: 25px;
    }

    a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .employee {
      background: #1976d2;
    }

    .candidate {
      background: #2e7d32;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Select Form</h2>

    <a class="employee"
       href="https://docs.google.com/forms/d/e/1FAIpQLSdgd94xLf8G9QSprjpt-O5Si66l5a4nwmJncxXx3cMhXK6mLQ/viewform?usp=publish-editor"
       target="_blank">
       Employee Form
    </a>

    <a class="candidate"
       href="https://docs.google.com/forms/d/e/1FAIpQLSfNE_OG4nC0ExQ_u4SYm7hkytidgrni465pZ0RCuHR9XwSHDA/viewform?usp=publish-editor"
       target="_blank">
       Candidate Form
    </a>
  </div>

</body>
</html>
